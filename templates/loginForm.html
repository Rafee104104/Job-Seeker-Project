{% extends 'base.html' %}
{% block content %}
<br><br><br><br>
<center>
    <h2>Login Page</h2><br>
</center>
<center>
    <p>Welcome to the login page. Please enter your credentials below to access your account.</p><br>
</center>
<div class="row justify-content-center">
    <div class="col-md-6">
        <form method="POST">
            {% csrf_token %}
            {{form.as_p}}
            <br>
            <center><input class="btn btn-success" type="submit" value="Sign In"></center>
        </form>
        <p class="text-center">
                <br>
                <a href="{% url 'registration' %}">Don't have an account? Sign up here.</a><br><br>   
                <a href="{% url 'forget_pass' %}">Forgot your password? Click here to reset it.</a>                                            
        </p>
    </div>
</div>
{% endblock %}
