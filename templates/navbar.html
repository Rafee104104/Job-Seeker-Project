{% load static %}
<center>

<div class="container container-center">
   
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  {% if request.user.is_authenticated %}  
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'homepage' %}">{{user.username}}</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      
      <div class="navbar-nav">
        {% if request.user.user_type == 'jobRecruiter' %}
          <a class="nav-link" aria-current="page" href="{% url 'homepage' %}">Jobs List</a>
          <a class="nav-link" aria-current="page" href="{% url 'forget_pass' %}">Change Password</a>  
          <a class="nav-link" href="{% url 'jobRecruiterProfile' %}">View Profile</a>
        {% else %}
          <a class="nav-link" aria-current="page" href="{% url 'homepage' %}">Posted Jobs List</a>
          <a class="nav-link" aria-current="page" href="{% url 'forget_pass' %}">Change Password</a>
          <a class="nav-link" href="{% url 'jobSeekerProfile' %}">View Profile</a>
        {% endif %}        
        <a class="nav-link" href="{% url 'user_logout' %}">Logout</a>
      </div>
      <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
      <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
  {% endif %}
</nav>

</div>

</center>
